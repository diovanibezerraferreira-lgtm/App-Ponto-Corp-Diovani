<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PontoCorp" />
  <title>PontoCorp — Controle de Ponto Inteligente</title>
  <link rel="manifest" href="/manifest.json" />
  <link id="dynamic-apple-icon" rel="apple-touch-icon" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    .hidden-view { display: none !important; }
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: #fff !important; color: #000 !important; }
      .print-shadow-none { box-shadow: none !important; border: 1px solid #cbd5e1 !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- BARRA SUPERIOR -->
  <header class="bg-slate-900 text-white shadow-md no-print sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-3 cursor-pointer" onclick="switchView('home')">
        <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center shadow-inner">
          <i data-lucide="clock-4" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <span class="font-extrabold text-lg tracking-tight">PontoCorp</span>
          <span class="hidden sm:inline-block text-xs text-slate-400 border-l border-slate-700 pl-2 ml-2">REP-P Digital</span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span id="cloud-status-badge" class="hidden sm:inline-flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
          <span id="cloud-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
          <span id="cloud-status-text">Conectando...</span>
        </span>
        <button onclick="switchView('employee')" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs sm:text-sm font-medium transition border border-slate-700">
          App Funcionário
        </button>
        <button onclick="openAdminAccess()" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-xs sm:text-sm font-semibold transition shadow">
          Painel Admin
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== TELA INICIAL ==================== -->
  <main id="view-home" class="flex-1 flex flex-col items-center justify-center px-4 py-10">
    <div class="max-w-4xl w-full text-center mb-10">
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-100 text-blue-700 text-xs font-semibold mb-4">
        <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Portaria 671 • Conformidade Trabalhista
      </span>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight mb-3">
        Controle de Ponto Inteligente
      </h1>
      <p class="text-slate-600 max-w-2
